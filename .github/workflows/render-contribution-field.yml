name: Render contribution field

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: profile-contribution-field
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render public practice
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/render-contributions.mjs guidegdm assets/contribution-field.svg

      - name: Commit a changed signal
        run: |
          if git diff --quiet -- assets/contribution-field.svg; then
            echo "Contribution field is already current."
            exit 0
          fi
          git config user.name "guidegdm-studio[bot]"
          git config user.email "guidegdm-studio[bot]@users.noreply.github.com"
          git add assets/contribution-field.svg
          git commit -m "chore(profile): refresh contribution signal"
          git push
